<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/estilo.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <form action="index.html" enctype="multipart/form-data" method="GET" name="miformulario"></form>
            <div class="form-group">
                <label for="nombre">Nombre: </label>
                <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Ingrese su Nombre">
            </div>
            <div class="form-group">
                <label for="colores">¿Que color prefiere?</label>
                <select name="colores" >
                    <option value="1">Morado</option>
                    <option value="2">Blanco</option>
                    <option value="3">Rojo</option>
                    <option value="4">Amarillo</option>
                    <option value="5">Verde</option>
                </select>
            </div>
            <div class="form-group">
                <label for="frutas">¿Cual es tu fruta favorita?</label>
                <select name="frutas">
                    <optgroup label="Frutas Rojas">
                        <option value="1">Guinda</option>
                        <option value="2">Frutilla</option>
                        <option value="3">Granada</option>
                        <option value="4">Sandía</option>
                    </optgroup>
                    <optgroup label="Frutas Verdes">
                        <option value="5">Melón</option>
                        <option value="6">Kiwi</option>
                        <option value="7">Tuna</option>
                        <option value="8">Manzana</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group" id="mietiqueta">
                <label for="postres">Que postre prefiere?</label>
                <select name="postres" size=3>
                    <option value="1">Pié de Limón</option>
                    <option value="2">Helado Vainilla</option>
                    <option value="3">Duraznos con Crema</option>
                    <option value="4">Panqueques</option>
                    <option value="5">Jalea</option>
                    <option value="6">Mouse de Frutilla</option>
                </select>
            </div>
        </div>

    <!--Referencias a las librerías-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js" integrity="sha384-+YQ4JLhjyBLPDQt//I+STsc9iw4uQqACwlvpslubQzn4u2UU2UFM80nGisd026JF" crossorigin="anonymous"></script>
    </body>
</html>
