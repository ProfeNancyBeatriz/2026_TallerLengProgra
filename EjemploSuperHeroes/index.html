<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super H&eacute;roes</title>
    <link rel="stylesheet" href="css/miCss.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!--NavBar-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/logoNav.png" alt="logo" width="60">
                Superheroes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Marvel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">DC Comics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Donar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--FIN: NavBar-->
    <!--Carrusel-->
    <!--el atributo data-bs-ride="carousel" esa el que genera el AutoPlay-->
    <div id="carruselMio" class="carousel slide" data-bs-ride="carousel">
        <!--en el carousel-inner se indica que se mostrará-->
        <div class="carousel-inner">
            <!--por cada slice debo tener un carousel-item y con active indico cual es la primera-->
            <div class="carousel-item active">
                <img src="img/intro-bg.jpg" class="imgCarousel" alt="...">
            </div>
            <div class="carousel-item">
                <img src="img/s_batman.jpg" class="imgCarousel" alt="...">
            </div>
            <div class="carousel-item">
                <img src="img/s_mujermaravilla.jpg" class="imgCarousel" alt="...">
            </div>
            <div class="carousel-item">
                <img src="img/s_deadpool.jpg" class="imgCarousel" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carruselMio"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselMio"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!--FIN: Carrusel-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
